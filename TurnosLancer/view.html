<section id="turnosLancerPage" class="app-page turnos-lancer-page hidden" data-page="turnos-lancer">
    <div class="turnos-lancer-layout">
        <section class="turnos-panel turnos-roster" aria-labelledby="turnosRosterTitle">
            <div class="turnos-panel-header">
                <div>
                    <p class="turnos-kicker">Participantes</p>
                    <h2 id="turnosRosterTitle">Tarjetas disponibles</h2>
                </div>
                <button id="addTurnoCard" class="primary-button" type="button">Nueva tarjeta</button>
            </div>

            <div class="turnos-roster-sections">
                <section class="turnos-roster-section" aria-labelledby="turnosAlliesTitle">
                    <h3 id="turnosAlliesTitle">Aliados</h3>
                    <div id="turnosAlliesList" class="turnos-card-list" data-zone="roster" aria-label="Participantes aliados"></div>
                </section>

                <section class="turnos-roster-section" aria-labelledby="turnosEnemiesTitle">
                    <h3 id="turnosEnemiesTitle">Enemigos</h3>
                    <div id="turnosEnemiesList" class="turnos-card-list" data-zone="roster" aria-label="Participantes enemigos"></div>
                </section>
            </div>
        </section>

        <section class="turnos-panel turnos-sequence" aria-labelledby="turnosSequenceTitle">
            <div class="turnos-round" aria-labelledby="turnosRoundTitle">
                <p id="turnosRoundTitle" class="turnos-kicker">Ronda</p>
                <div class="turnos-round-controls">
                    <button id="previousRound" class="secondary-button turnos-round-button" type="button" aria-label="Ronda anterior">&lt;</button>
                    <span id="currentRound" class="turnos-round-value" aria-live="polite">1</span>
                    <button id="nextRound" class="secondary-button turnos-round-button" type="button" aria-label="Ronda siguiente">&gt;</button>
                </div>
            </div>

            <div class="turnos-panel-header">
                <div>
                    <p class="turnos-kicker">Orden actual</p>
                    <h2 id="turnosSequenceTitle">Turnos</h2>
                </div>
                <div class="turnos-actions">
                    <button id="advanceTurno" class="secondary-button" type="button">Siguiente turno</button>
                </div>
            </div>

            <div id="turnosStatus" class="turnos-status" aria-live="polite">Arrastra una tarjeta aqui para iniciar la ronda.</div>
            <div id="turnosSequenceList" class="turnos-card-list turnos-drop-zone" data-zone="sequence" aria-label="Lista de turnos"></div>
            <div class="turnos-combat-actions">
                <button id="newCombat" class="secondary-button" type="button">Nuevo combate</button>
            </div>
        </section>
    </div>

    <dialog id="turnoCardDialog" class="turnos-dialog" aria-labelledby="turnoCardDialogTitle">
        <form id="turnoCardForm" method="dialog" class="turnos-form">
            <div class="turnos-dialog-header">
                <h2 id="turnoCardDialogTitle">Nueva tarjeta</h2>
                <button id="closeTurnoCardDialog" class="dialog-close" type="button" aria-label="Cerrar">×</button>
            </div>

            <label>
                Nombre
                <input id="turnoCardName" name="name" type="text" autocomplete="off" maxlength="60" required />
            </label>

            <fieldset class="turnos-type-field">
                <legend>Bando</legend>
                <label class="turnos-type-option">
                    <input type="radio" name="type" value="ally" checked />
                    <span class="turnos-type-button turnos-type-button-ally">Aliado</span>
                </label>
                <label class="turnos-type-option">
                    <input type="radio" name="type" value="enemy" />
                    <span class="turnos-type-button turnos-type-button-enemy">Enemigo</span>
                </label>
            </fieldset>

            <label id="createAnotherCardOption" class="turnos-create-another">
                <input id="createAnotherCard" name="createAnother" type="checkbox" />
                Crear nueva tarjeta despues
            </label>

            <div class="turnos-form-actions">
                <button id="cancelTurnoCardDialog" class="secondary-button" type="button">Cancelar</button>
                <button id="saveTurnoCard" class="primary-button" type="submit">Crear</button>
            </div>
        </form>
    </dialog>
</section>
