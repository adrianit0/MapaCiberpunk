<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa interactivo</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>
<main id="authView" class="auth-page">
    <section class="auth-panel" aria-labelledby="authTitle">
        <div class="auth-copy">
            <p class="auth-kicker">Acceso privado</p>
            <h1 id="authTitle">Mapa interactivo Cyberpunk RED</h1>
            <p>Inicia sesion o crea una cuenta para acceder al mapa de Night City 2045.</p>
        </div>

        <form id="authForm" class="auth-form">
            <div class="auth-tabs" role="tablist" aria-label="Modo de acceso">
                <button id="loginMode" class="auth-tab active" type="button" aria-pressed="true">Entrar</button>
                <button id="registerMode" class="auth-tab" type="button" aria-pressed="false">Registro</button>
            </div>

            <label>
                Email
                <input id="authEmail" name="email" type="email" autocomplete="email" required />
            </label>

            <label>
                Password
                <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" required />
            </label>

            <p id="authMessage" class="auth-message" role="status"></p>

            <button id="authSubmit" class="primary-button" type="submit">Entrar</button>
        </form>
    </section>
</main>

<main id="mapView" class="app hidden" aria-hidden="true">
    <header class="app-header">
        <h1>Mapa interactivo</h1>
        <button id="logoutButton" class="secondary-button" type="button">Salir</button>
    </header>

    <div class="map-stage">
        <button id="menuToggle" class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="sideMenu">☰</button>
        <button id="addLocationToggle" class="add-location-toggle" type="button" aria-pressed="false">Añadir localización</button>

        <aside id="sideMenu" class="side-menu" aria-hidden="true">
            <div id="menuContent" class="side-menu-content"></div>
        </aside>

        <div class="map-container" id="mapContainer" aria-label="Mapa navegable" role="application">
            <div class="map-content" id="mapContent">
                <img src="mapa.jpg" alt="Mapa interactivo" draggable="false" />

                <svg class="overlay" viewBox="0 0 4614 4606"></svg>
            </div>
        </div>

        <section id="info" class="info" aria-live="polite">
            Selecciona una región del mapa.
        </section>

        <section id="debugInfo" class="debug-info" aria-live="off"></section>
    </div>
    <dialog id="addLocationDialog" class="location-dialog">
        <form id="addLocationForm" method="dialog" class="location-form">
            <div class="location-form-header">
                <h2>Nueva localización</h2>
                <button id="closeLocationDialog" class="dialog-close" type="button" aria-label="Cerrar">×</button>
            </div>

            <h4 style="color:red">AVISO: Los cambios no se guardaran tras actualizar</h4>

            <label>
                Tipo de localización
                <select id="locationType" name="type" required></select>
            </label>

            <label>
                Título
                <input id="locationTitle" name="title" type="text" required />
            </label>

            <label>
                Info
                <textarea id="locationInfo" name="info" rows="4"></textarea>
            </label>

            <label>
                Reference
                <input id="locationReference" name="reference" type="text" required />
            </label>

            <div class="location-form-actions">
                <button id="cancelLocationDialog" class="secondary-button" type="button">Cancelar</button>
                <button class="primary-button" type="submit">Guardar</button>
            </div>
        </form>
    </dialog>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseConfig.js"></script>
<script src="auth.js"></script>
<script src="llamadasAjax.js"></script>
<script src="locations.js"></script>
<script src="regions.js"></script>
<script src="script.js"></script>
<script src="app.js"></script>
</body>
</html>
