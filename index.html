<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa interactivo</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="app">
    <h1>Mapa interactivo</h1>

    <div class="map-stage">
        <div class="map-container" id="mapContainer" aria-label="Mapa navegable" role="application">
            <div class="map-content" id="mapContent">
                <img src="mapa.jpg" alt="Mapa interactivo" draggable="false" />

                <svg class="overlay" viewBox="0 0 4614 4606"></svg>
            </div>
        </div>

        <section id="info" class="info" aria-live="polite">
            Selecciona una región del mapa.
        </section>

        <section id="debugInfo" class="debug-info" aria-live="off"></section>
    </div>
</main>

<script src="locations.js"></script>
<script src="regions.js"></script>
<script src="script.js"></script>
</body>
</html>
