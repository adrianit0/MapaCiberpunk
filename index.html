<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa interactivo</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="app">
    <h1>Mapa interactivo</h1>

    <div class="map-stage">
        <div class="map-container" id="mapContainer" aria-label="Mapa navegable" role="application">
            <div class="map-content" id="mapContent">
                <img src="mapa.jpg" alt="Mapa interactivo" draggable="false" />

                <svg class="overlay" viewBox="0 0 1000 1400" >
                    <polygon
                            class="region"
                            points="120,90 300,80 340,220 150,260"
                            data-title="Región Norte"
                            data-info="Aquí puedes mostrar población, clima, enlaces u otra información relevante."
                    />

                    <polygon
                            class="region"
                            points="420,180 620,150 700,330 500,380"
                            data-title="Región Central"
                            data-info="Información detallada de la región central del mapa."
                    />

                    <polygon
                            class="region"
                            points="200,360 390,330 430,520 240,560"
                            data-title="Región Sur"
                            data-info="Datos específicos de la región sur."
                    />

                    <g class="poi" transform="translate(300 160)"
                       data-title="POI 1 · Torre de vigilancia"
                       data-info="Torre de vigilancia con acceso restringido y sensores de largo alcance.">
                        <circle r="18" fill="#6f42c1" />
                        <text class="poi-label poi-label-light" text-anchor="middle" dominant-baseline="middle">1</text>
                    </g>

                    <g class="poi" transform="translate(570 250)"
                       data-title="POI 2 · Mercado negro"
                       data-info="Zona de comercio clandestino de implantes y piezas electrónicas.">
                        <circle r="18" fill="#ffd43b" />
                        <text class="poi-label poi-label-dark" text-anchor="middle" dominant-baseline="middle">2</text>
                    </g>

                    <g class="poi" transform="translate(340 450)"
                       data-title="POI 3 · Estación energética"
                       data-info="Nodo de distribución eléctrica de alta capacidad para el sector sur.">
                        <circle r="18" fill="#14b8a6" />
                        <text class="poi-label poi-label-dark" text-anchor="middle" dominant-baseline="middle">3</text>
                    </g>
                </svg>
            </div>
        </div>

        <section id="info" class="info" aria-live="polite">
            Selecciona una región del mapa.
        </section>

        <section id="debugInfo" class="debug-info" aria-live="off"></section>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
