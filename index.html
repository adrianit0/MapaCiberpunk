<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Herramientas de rol</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>
<main id="authView" class="auth-page">
    <section class="auth-panel" aria-labelledby="authTitle">
        <div class="auth-copy">
            <p class="auth-kicker">Acceso privado</p>
            <h1 id="authTitle">Herramientas de Rol para Cyberpunk RED y Lancer</h1>
            <p>Inicia sesión o crea una cuenta para acceder a las herramientas de rol (Night City 2045 y Lancer).</p>
        </div>

        <form id="authForm" class="auth-form">
            <div class="auth-tabs" role="tablist" aria-label="Modo de acceso">
                <button id="loginMode" class="auth-tab active" type="button" aria-pressed="true">Entrar</button>
                <button id="registerMode" class="auth-tab" type="button" aria-pressed="false">Registro</button>
            </div>

            <label>
                Email
                <input id="authEmail" name="email" type="email" autocomplete="email" required />
            </label>

            <label id="authNameField" class="register-field hidden">
                Nombre
                <input id="authName" name="name" type="text" autocomplete="name" />
            </label>

            <label id="authUsernameField" class="register-field hidden">
                Username
                <input id="authUsername" name="username" type="text" autocomplete="username" />
            </label>

            <label>
                Password
                <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" required />
            </label>

            <p id="authMessage" class="auth-message" role="status"></p>

            <button id="authSubmit" class="primary-button" type="submit">Entrar</button>
            <button id="guestAccess" class="secondary-button" type="button">Entrar como invitado</button>
        </form>
    </section>
</main>

<section id="appView" class="app hidden" aria-hidden="true">
    <header id="appHeader" class="app-header">
        <div id="appHeaderTabs" class="app-header-tabs">

        </div>
        <div class="app-header-actions">
            <button id="profileButton" class="secondary-button" type="button">Perfil</button>
            <button id="versionsButton" class="secondary-button" type="button">Ver versiones</button>
            <button id="logoutButton" class="secondary-button" type="button">Salir</button>
        </div>
    </header>

    <main id="appContent" class="app-content" aria-live="polite"></main>
</section>

<dialog id="versionsDialog" class="versions-dialog" aria-labelledby="versionsDialogTitle">
    <div class="versions-panel">
        <div class="versions-header">
            <h2 id="versionsDialogTitle">Versiones</h2>
            <button id="closeVersionsDialog" class="dialog-close" type="button" aria-label="Cerrar">×</button>
        </div>
        <div id="versionsList" class="versions-list"></div>
    </div>
</dialog>

<dialog id="profileDialog" class="profile-dialog" aria-labelledby="profileDialogTitle">
    <form id="profileForm" class="profile-panel">
        <div class="profile-header">
            <h2 id="profileDialogTitle">Perfil</h2>
            <button id="closeProfileDialog" class="dialog-close" type="button" aria-label="Cerrar">×</button>
        </div>

        <label>
            Nombre
            <input id="profileName" name="name" type="text" autocomplete="name" required />
        </label>

        <label>
            Username
            <input id="profileUsername" name="username" type="text" autocomplete="username" required />
        </label>

        <label>
            Avatar URL
            <input id="profileAvatarUrl" name="avatar_url" type="url" autocomplete="url" />
        </label>

        <p id="profileMessage" class="auth-message" role="status"></p>

        <button id="profileSubmit" class="primary-button" type="submit">Guardar</button>
    </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Utils/supabaseConfig.js"></script>
<script src="Utils/ajaxController.js"></script>
<script src="Login/llamadasAjax.js"></script>
<script src="Login/auth.js"></script>
<script src="Mapa/llamadasAjax.js"></script>
<script src="Mapa/locations.js"></script>
<script src="Mapa/regions.js"></script>
<script src="Mapa/presenter.js"></script>
<script src="TurnosLancer/presenter.js"></script>
<script src="Dados/llamadasAjax.js"></script>
<script src="Dados/presenter.js"></script>
<script src="Version/versiones.js"></script>
<script src="app.js"></script>
</body>
</html>
